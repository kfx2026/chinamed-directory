var LANG_LABELS = {zh:"中",en:"EN",fr:"FR",de:"DE",es:"ES",ru:"RU",ko:"KO",ar:"AR"};
var PAGE_TYPE = "general";
var PAGE_FILTER_DISABLED = false;
var pageBase = "./general-hospitals.html";

function getData(lang) {
  return lang === "zh" ? HOSP_DATA_ZH : HOSP_DATA_EN;
}

function render(lang) {
  var d = I18N[lang] || I18N["en"];
  var data = getData(lang);
  var isRTL = lang === "ar";

  document.documentElement.lang = isRTL ? "ar" : lang;
  document.documentElement.dir = isRTL ? "rtl" : "ltr";
  document.body.style.direction = isRTL ? "rtl" : "";

  // Page title
  var tk = "page_title_" + PAGE_TYPE;
  var sk = "page_sub_" + PAGE_TYPE;
  document.title = (d[tk] || "") + " — MediChina · 来华就医";

  // Data-key elements
  document.querySelectorAll("[data-key]").forEach(function(el) {
    var k = el.dataset.key;
    if (d[k]) el.innerHTML = d[k];
  });

  // Update nav links
  var pages = {
    navHome:"./index.html", navGeneral:"./general-hospitals.html",
    navSpecialty:"./specialty-hospitals.html", navAbout:"./about.html",
    navContact:"./contact.html", navLegal:"./legal-notice.html"
  };
  for (var id in pages) {
    var a = document.getElementById(id);
    if (a) a.href = pages[id] + "?lang=" + lang;
  }
  document.getElementById("homeLink").href = "./index.html?lang=" + lang;

  // Footer
  var fh = "<h3>MediChina · 来华就医</h3><p style='margin-bottom:16px'>" + d.footer_desc + "</p>";
  fh += "<div style='display:flex;gap:24px;flex-wrap:wrap'>";
  fh += "<a href='./general-hospitals.html?lang=" + lang + "'>" + d.nav_general + "</a>";
  fh += "<a href='./specialty-hospitals.html?lang=" + lang + "'>" + d.nav_specialty + "</a>";
  fh += "<a href='./about.html?lang=" + lang + "'>" + d.nav_about + "</a>";
  fh += "<a href='./legal-notice.html?lang=" + lang + "'>" + d.nav_legal + "</a>";
  fh += "</div><hr class='footer-divider'><div class='footer-legal'>" + d.footer_disclaimer + "</div>";
  document.getElementById("footerContent").innerHTML = fh;

  // Check for region/specialty filter
  var regionIndex = null;
  if (!PAGE_FILTER_DISABLED) {
    var hash = location.hash;
    var m = hash && hash.match(/^#(region|spec)-(\d+)$/);
    if (m) regionIndex = parseInt(m[2]);
  }

  var html = "";
  // Back link when filtered
  if (regionIndex !== null && data[regionIndex]) {
    html += '<div style="margin-bottom:20px"><a href="' + pageBase + '?lang=' + lang + '" style="display:inline-flex;align-items:center;gap:4px;color:var(--gold);text-decoration:none;font-size:14px;font-weight:600;padding:8px 0">← ' + (d.back_all || 'Show All Regions') + '</a></div>';
  }

  var start = regionIndex !== null && data[regionIndex] ? regionIndex : 0;
  var end = regionIndex !== null ? (start + 1) : data.length;

  for (var i = start; i < end && i < data.length; i++) {
    var r = data[i];
    var title = r.title;
    var anchorPrefix = PAGE_TYPE === "specialty" ? "spec" : "region";
    if (PAGE_TYPE === "specialty" && SPEC_GROUPS && SPEC_GROUPS[lang]) {
      title = SPEC_GROUPS[lang][i] || r.title;
    }
    html += '<div class="region" id="' + anchorPrefix + '-' + i + '"><div class="region-title">' + title + '<span class="region-count">' + r.count + " " + d.hospitals_count + '</span></div>';
    for (var j = 0; j < r.cards.length; j++) {
      var c = r.cards[j];
      var name = lang === "zh" ? c.name_zh : c.name_en;
      var city = lang === "zh" ? c.city_zh : c.city_en;
      var specs = lang === "zh" ? c.specs_zh : c.specs_en;
      html += '<div class="hcard"><div class="hcard-top"><div><div class="hcard-name"><a href="./hospitals/' + c.subdir + '/' + c.id + '.html?lang=' + lang + '">' + name + '</a></div><div class="hcard-info">' + city + '</div></div><div class="hcard-arrow"><a href="./hospitals/' + c.subdir + '/' + c.id + '.html?lang=' + lang + '">' + d.view_detail + '</a></div></div>';
      if (specs && specs.length > 0) {
        html += '<div class="hcard-tags">';
        for (var k = 0; k < specs.length; k++) {
          html += '<span class="hcard-tag">' + specs[k] + '</span>';
        }
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  document.getElementById("hospitalList").innerHTML = html;
  // Scroll to top when filtered
  setTimeout(function() {
    window.scrollTo({top: 0, behavior: 'instant'});
  }, 10);
}

function buildLangBar(cur) {
  var html = "";
  Object.keys(LANG_LABELS).forEach(function(l) {
    html += '<button class="lang-btn' + (l === cur ? ' selected' : '') + '" onclick="switchLang(\'' + l + '\')">' + LANG_LABELS[l] + '</button>';
  });
  document.getElementById("langBar").innerHTML = html;
}

function switchLang(lang) {
  var hash = location.hash;
  localStorage.setItem("mc_lang", lang);
  render(lang);
  buildLangBar(lang);
  // Restore hash after lang switch
  if (hash) {
    location.hash = hash;
  }
}

(function() {
  var lang = localStorage.getItem("mc_lang") || new URLSearchParams(location.search).get("lang") || "zh";
  if (!I18N[lang]) lang = "zh";
  buildLangBar(lang);
  render(lang);
})();
</script>
