function render(lang){

function buildLangBar(cur){
  var h="";Object.keys(LANG_LABELS).forEach(function(l){
    h+='<button class="lang-btn'+(l===cur?' selected':'')+'" onclick="switchLang(\''+l+'\')">'+LANG_LABELS[l]+'</button>';
  });document.getElementById("langBar").innerHTML=h;
}
function switchLang(lang){localStorage.setItem("chinamed_lang",lang);render(lang);buildLangBar(lang);}
